name: Set up toolchain
description: Python (via uv), Node and the pinned Wrangler, with caches.
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        version: "0.13.0"
        enable-cache: true
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: "22"
        cache: npm
    - name: Install Python dependencies (locked)
      shell: bash
      run: uv sync --locked
    - name: Install Wrangler (locked)
      shell: bash
      run: npm ci
