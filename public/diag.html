<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#22170f" />
    <meta name="robots" content="noindex" />
    <title>Diagnostics · labscloud chess</title>
    <link rel="stylesheet" href="/css/app.css" />
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <script type="module" src="/js/diag.js"></script>
  </head>
  <body>
    <main class="page page--lobby">
      <header class="topbar">
        <h1 class="brand__name">Diagnostics</h1>
        <a href="/">Games</a>
      </header>
      <section class="card">
        <h2 class="card__title">CPU replay</h2>
        <p class="hint">Creates a game and plays 150 plies through the server, one request per move, to check that no request exceeds the Workers Free CPU limit.</p>
        <button type="button" class="btn btn--primary" id="run">Run CPU replay</button>
        <p class="status-line" id="progress" role="status" aria-live="polite"></p>
        <table class="diag-table"><tbody id="results"></tbody></table>
        <button type="button" class="btn" id="copy" disabled>Copy results</button>
      </section>
    </main>
  </body>
</html>
