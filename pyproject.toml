[project]
name = "labscloud-chess"
version = "0.1.0"
description = "Private two-player chess on Cloudflare Workers (Python)"
requires-python = ">=3.12"
# No runtime dependencies from PyPI: python-chess is vendored in src/chess
# because PyPI only ships it as an sdist and pywrangler installs wheels only
# (it runs `uv pip compile --no-build`). See docs/platform-notes.md §1.
dependencies = []

[dependency-groups]
dev = [
  "workers-py==1.17.7",
  "workers-runtime-sdk==1.9.3",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "hypothesis==6.169.0",
  "jsonschema==4.26.0",
  "ruff==0.17.0",
  "pyright==1.1.414",
  "aiohttp==3.14.5",
  "websockets==17.2",
  "httpx==0.28.1",
  "playwright==1.63.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/contract"]
pythonpath = ["src", "."]
addopts = "-q --strict-markers"
filterwarnings = [
  "error",
  # In-memory SQLite connections in tests are released with the test's objects.
  "ignore:unclosed database:ResourceWarning",
]
markers = [
  "integration: needs a running server (devserver or pywrangler dev)",
  "e2e: needs a browser and a running server",
]

[tool.coverage.run]
branch = true
source = ["src/chess_core", "src/app"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["src/chess", "src/vendor", "python_modules"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PL", "C4", "PIE", "RET"]
ignore = [
  "PLR2004",  # magic numbers are fine in chess and tests
  "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917",
  "E501",     # the formatter wraps code; long strings and comments are left alone
  "S101",     # asserts are used in tests
  "RUF001", "RUF002", "RUF003",  # unicode in strings/comments is intended (chess, en dashes)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLC0415", "B011"]
"devserver/**" = ["S104"]
"scripts/**" = ["S603", "S607", "T201"]

[tool.pyright]
include = ["src", "devserver", "tests", "scripts"]
exclude = ["src/chess", "**/__pycache__", ".venv"]
stubPath = "typings"
pythonVersion = "3.13"
typeCheckingMode = "standard"
reportMissingModuleSource = "none"  # js is Pyodide-only; typings/js.pyi describes it
